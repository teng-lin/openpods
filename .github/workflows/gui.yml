name: Native GPUI desktop
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Native renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake clang libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libxcb1-dev libx11-dev libssl-dev zlib1g-dev libdbus-1-dev
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path librepods-gui/Cargo.toml -- --check
      - run: cargo clippy --manifest-path librepods-gui/Cargo.toml --all-targets --features ui-test --locked -- -D warnings
      - run: python3 scripts/check-gui-deps.py
      - name: Headless pointer/keyboard and IPC tests
        run: cargo test --manifest-path librepods-gui/Cargo.toml --features ui-test --locked
      - name: Link native executable
        run: cargo build --manifest-path librepods-gui/Cargo.toml --features desktop --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --manifest-path librepods-gui/Cargo.toml --locked check
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: scripts/gui-coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-coverage
          path: target/gui-coverage.json
