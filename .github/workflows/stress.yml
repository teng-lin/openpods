name: Scheduled cancellation and recovery stress

on:
  schedule:
    - cron: '47 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  regression-stress:
    name: Linux / ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: [minimal, ble]
    env:
      TEST_FEATURES: ${{ matrix.features }}
      CANCEL_REPEATS: "100"
      CRITICAL_REPEATS: "10"
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Repeat isolated cancellation and critical actor regressions
        shell: bash
        run: |
          set -euo pipefail
          features=()
          if [[ "$TEST_FEATURES" == ble ]]; then features=(--features ble); fi
          log_dir="target/stress-logs/$TEST_FEATURES"
          mkdir -p "$log_dir"
          {
            git rev-parse HEAD
            rustc --version
            cargo --version
            sha256sum Cargo.lock
          } > "$log_dir/environment.txt"

          run_logged() {
            local limit="$1" label="$2"
            shift 2
            local log="$log_dir/$label.log"
            printf 'command:' > "$log"
            printf ' %q' "$@" >> "$log"
            printf '\n' >> "$log"
            if timeout --signal=TERM --kill-after=10s "$limit" "$@" >> "$log" 2>&1; then
              printf '\nexit_status=0\n' >> "$log"
              printf '%s passed\n' "$label"
            else
              local status=$?
              printf '\nexit_status=%s\n' "$status" >> "$log"
              cat "$log" >&2
              exit "$status"
            fi
          }

          run_logged 10m build cargo test -p librepods-daemon --no-default-features "${features[@]}" --locked --lib --test runtime --test recovery --test readback --no-run
          for ((iteration=1; iteration<=CANCEL_REPEATS; iteration++)); do
            run_logged 30s "cancel-$iteration" cargo test -p librepods-daemon --no-default-features "${features[@]}" --locked --test runtime disconnected_queued_client_cannot_cause_a_late_mutation -- --exact --nocapture
          done
          for ((iteration=1; iteration<=CRITICAL_REPEATS; iteration++)); do
            run_logged 120s "critical-$iteration" cargo test -p librepods-daemon --no-default-features "${features[@]}" --locked --lib --test runtime --test recovery --test readback -- --nocapture
          done
      - name: Preserve stress diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-stress-${{ matrix.features }}-${{ github.run_id }}
          path: target/stress-logs/${{ matrix.features }}/
          if-no-files-found: warn
          retention-days: 14
