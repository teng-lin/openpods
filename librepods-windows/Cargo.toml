[features]
default = []
ble = ["dep:btleplug", "dep:futures"]

[package]
name = "librepods-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows platform implementations for LibrePods (WinSock Bluetooth, WinRT)"

# All platform I/O is only pulled in on Windows; on other targets this crate
# compiles to an empty library (see `src/lib.rs`).
[target.'cfg(target_os = "windows")'.dependencies]
librepods-core = { path = "../librepods-core", version = "0.1.0" }
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
btleplug = { version = "0.12.0", optional = true }

# WinSock (raw L2CAP sockets) and WinRT (Bluetooth enumeration + SMTC media).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_Bluetooth",
    "Win32_Networking_WinSock",
] }
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Media_Control",
    "Media_Devices",
    "Win32_System_Com",
] }

futures = { version = "0.3", optional = true }
