[package]
name = "librepods-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ble = ["librepods-api/ble", "librepods-linux/ble", "librepods-windows/ble", "librepods-core/ble"]

[dependencies]
librepods-api = { version = "0.1.0", path = "../librepods-api", features = ["transport"] }
librepods-core = { version = "0.1.0", path = "../librepods-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "signal", "time", "test-util"] }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
librepods-linux = { version = "0.1.0", path = "../librepods-linux" }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
librepods-windows = { version = "0.1.0", path = "../librepods-windows" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
