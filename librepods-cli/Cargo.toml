[package]
name = "librepods-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI daemon for LibrePods — testing and headless operation on Linux and Windows"

[dependencies]
librepods-core = { path = "../librepods-core" }
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
clap = { version = "4", features = ["derive"] }

# The concrete platform implementation is selected at compile time.
[target.'cfg(target_os = "linux")'.dependencies]
librepods-linux = { path = "../librepods-linux" }

[target.'cfg(target_os = "windows")'.dependencies]
librepods-windows = { path = "../librepods-windows" }
