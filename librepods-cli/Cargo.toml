[package]
name = "librepods-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI daemon for LibrePods — testing and headless operation on Linux and Windows"

[features]
default = []
ble = ["librepods-daemon/ble", "librepods-linux/ble", "librepods-windows/ble", "librepods-core/ble"]

[dependencies]
librepods-daemon = { version = "0.1.0", path = "../librepods-daemon" }
serde_json = "1"
librepods-core = { version = "0.1.0", path = "../librepods-core" }
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
clap = { version = "4", features = ["derive"] }

# The concrete platform implementation is selected at compile time.
[target.'cfg(target_os = "linux")'.dependencies]
librepods-linux = { version = "0.1.0", path = "../librepods-linux" }

[target.'cfg(target_os = "windows")'.dependencies]
librepods-windows = { version = "0.1.0", path = "../librepods-windows" }
